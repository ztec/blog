on:
  push:
    branches:
      - main
  workflow_dispatch: {}
concurrency:
  group: blog-bunny-production
  cancel-in-progress: false
jobs:
  Deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: checkout theme submodule
        env:
          FORGEJO_TOKEN: ${{ github.token }}
        run: >-
          git -c
          url."https://token:${FORGEJO_TOKEN}@git2.riper.fr/".insteadOf="ssh://git@git.riper.fr:22023/"
          submodule update --init --recursive
      - name: Restore Hugo build cache
        uses: actions/cache@v4
        with:
          path: .cache/hugo
          key: hugo-v1-0.162.0-${{ runner.os }}-${{ hashFiles('config.toml', 'assets/**', 'layouts/**', 'content/**', 'themes/VHS/**') }}
          restore-keys: |
            hugo-v1-0.162.0-${{ runner.os }}-
      - name: Build and deploy to BunnyCDN
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          BUNNY_DEPLOY_COPY_MODE: 'true'
          GITHUB_SHA: ${{ github.sha }}
          PP_HOST: ${{ secrets.PP_HOST }}
          PP_TOKEN: ${{ secrets.PP_TOKEN }}
        run: ./bin/deploy.sh deploy
