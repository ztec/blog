baseURL = "https://blog.ztec.fr/"
title = "Chez Zed"
theme = "VHS"
enableRobotsTXT = true
disable_share = true
googleAnalytics = ""
enableGitInfo = true
staticDir = ["assets"]
timeout = "1200s"
locale = "fr-FR"
DefaultContentLanguage = "fr"
enableEmoji = true
summaryLength = 10

[security.funcs]
getenv = ['^HUGO_', '^CI$', 'PP_TOKEN', 'PP_HOST']

[pagination]
    pagerSize = 99

[markup]
[markup.highlight]
style = 'vim'
noClasses = false
lineNumbersInTable = false
lineNos = true
anchorLineNos=true

[[menu.main]]
    identifier = "concerts"
    name = "Concerts"
    url = "https://db.ztec.fr/concert/"
    weight = 70

[[menu.footer]]
    name = "Mentions légales"
    url = "https://www.ztec.fr/mentions-legales/"
    weight = 60

[sitemap]
  changefreq = "daily"
  priority = 0.5
  filename = "sitemap.xml"

[params]
    name = "Loïc Doubinine | Zed"
    site_slug = "blog"
    description = "Développeur, Architecte, DevOps et Site Reliability Engineer"
    images = []
    custom_css = ["css/blog.css"]

# Authoritative non-secret configuration for bin/bunny-deploy.
[params.bunny]
    api_url = "https://api.bunny.net"
    storage_zone = "ztec-fr-web"
    site_folder = "blog"
    site_hostname = "blog.ztec.fr"
    pull_zone_id = 4889935
    edge_rule_description = "Managed storage release for blog.ztec.fr"
    edge_rule_guid = "" # Empty means resolve by description and create when absent.
    edge_rule_order = "preserve" # Preserve an existing rule's order; let Bunny place a new rule.
    edge_rule_pattern = "*://blog.ztec.fr/*"
    retain_releases = 3 # Current release plus two rollback targets.
    upload_concurrency = 8

[languages]
    [languages.fr]
        label="Français"
    [languages.en]
        label="English"
        title = "Zed's place"
    [languages.en.params]
        description = "Developer, Architect, DevOps and Site Reliability Engineer"
    [[languages.en.menu.footer]]
        name = "Legals"
        url = "https://www.ztec.fr/en/legals/"
        weight = 60
    [[languages.en.menu.main]]
        identifier = "concerts"
        name = "Concerts"
        url = "https://db.ztec.fr/en/concert/"
        weight = 70



[permalinks]
[permalinks.page]
  quick = "/:year/:month/:slug/"
  post = "/:year/:section/:slug/"
  loot = "/:year/:month/:day/:sections/:slug/"
  godzilla = "/godzilla/:slug/"
[permalinks.term]
  sources = "/:sections/:slug/"


[taxonomies]
tag = 'tags'
source = 'sources'
resources = 'resources'

[caches]
    [caches.assets]
        dir = ':resourceDir/_gen'
        maxAge = "23h"
    [caches.getresource]
        dir = ':resourceDir/rsc/:project'
        maxAge = "10m"
    [caches.images]
        dir = ':resourceDir/_gen'
        maxAge = "23h"
    [caches.misc]
        dir = ':resourceDir/misc/:project'
        maxAge = "23h"
    [caches.modules]
        dir = ':resourceDir/modules'
        maxAge = "23h"
