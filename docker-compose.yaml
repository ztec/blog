services:
  dev:
    image: ztec-blog-dev:local
    build:
      context: ./bin
      dockerfile: ../Dockerfile
    entrypoint: hugo
    working_dir: /workspace
    command:
      - server
      - --port
      - "${PORT:-1313}"
      - --baseURL
      - "${BASEURL:-http://localhost:1313/}"
      - --appendPort=false
      - --bind=0.0.0.0
      - --noBuildLock
      - --destination
      - /tmp/hugo-public
      - --templateMetrics
      - --templateMetricsHints
    environment:
      HUGO_CACHEDIR: /cache/downloads
      HUGO_RESOURCEDIR: /cache/resources
      PP_HOST: "${PP_HOST:-}"
      PP_TOKEN: "${PP_TOKEN:-}"
    volumes:
      - ./:/workspace:ro,Z
      - hugo-cache:/cache
    ports:
      - "${PORT:-1313}:${PORT:-1313}"

volumes:
  hugo-cache:
